      - name: Resolve upstream version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main

          case "${UPDATE_CHANNEL}" in
            stable)
              target_ref="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"
              git fetch upstream "refs/tags/${target_ref}:refs/tags/${target_ref}"
              ;;
            edge)
              target_ref="upstream/main"
              ;;
            *)
              echo "Unsupported update channel: ${UPDATE_CHANNEL}" >&2
              exit 1
              ;;
          esac

          target_commit="$(git rev-parse "${target_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          target_version="$(git show "${target_commit}:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
          if [ -z "${target_version}" ]; then
            target_version="unknown"
          fi
          head_version="$(python3 -c 'import json; print(json.load(open("package.json")).get("version",""))' 2>/dev/null || true)"
          if [ -z "${head_version}" ]; then
            head_version="unknown"
          fi

          content_diff="$(git diff --name-only "${target_commit}" HEAD -- ':!.github/workflows/sync-edgeever-upstream.yml' || true)"

          root_commit="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          root_subject="$(git show -s --format=%s "${root_commit}")"
          non_workflow_changes="$(git diff --name-only "${root_commit}" HEAD -- ':!.github/workflows/sync-edgeever-upstream.yml' || true)"
          bootstrap_import=false
          if [ "${root_subject}" = "source repo import" ] && [ -z "${non_workflow_changes}" ]; then
            bootstrap_import=true
          fi

          update_required=false
          align_mode=none
          reason=""
          republish_only=false

          if [ -z "${content_diff}" ]; then
            update_required=false
            align_mode=none
            if [ "${head_commit}" = "${target_commit}" ]; then
              reason=already_on_target
            else
              reason=content_matches_target
            fi
            if [ "${FORCE_REDEPLOY}" = "true" ]; then
              republish_only=true
            fi
          elif git merge-base --is-ancestor HEAD "${target_commit}" 2>/dev/null; then
            update_required=true
            align_mode=reset
            reason=behind_target
          elif [ "${bootstrap_import}" = "true" ]; then
            update_required=true
            align_mode=reset
            reason=bootstrap_import
          elif git merge-base --is-ancestor "${target_commit}" HEAD 2>/dev/null; then
            update_required=true
            align_mode=merge
            reason=ahead_with_content_drift
          else
            if [ -z "${non_workflow_changes}" ] || [ "${bootstrap_import}" = "true" ]; then
              update_required=true
              align_mode=reset
              reason=deploy_mirror_reset
            else
              update_required=true
              align_mode=merge
              reason=customized_merge
            fi
          fi

          {
            echo "target_ref=${target_ref}"
            echo "target_commit=${target_commit}"
            echo "target_version=${target_version}"
            echo "head_commit=${head_commit}"
            echo "head_version=${head_version}"
            echo "update_required=${update_required}"
            echo "align_mode=${align_mode}"
            echo "reason=${reason}"
            echo "republish_only=${republish_only}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### EdgeEver upstream sync"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Channel | \`${UPDATE_CHANNEL}\` |"
            echo "| Upstream target | \`${target_ref}\` (\`${target_commit:0:12}\`, v${target_version}) |"
            echo "| Fork main before | \`${head_commit:0:12}\` (v${head_version}) |"
            echo "| Decision | \`${reason}\` / align=\`${align_mode}\` / update=\`${update_required}\` / republish=\`${republish_only}\` |"
            echo ""
            case "${reason}" in
              already_on_target)
                echo "**Already on upstream target.** No git update is needed. This is success for a read‑only deployment fork — not a skipped failure."
                ;;
              content_matches_target)
                echo "**Application content already matches upstream target** (history tip may differ). No git update is needed for deployment."
                ;;
              behind_target)
                echo "**Fork is behind upstream.** Aligning with a hard reset to the target commit (deploy‑mirror path)."
                ;;
              bootstrap_import)
                echo "**Cloudflare import history detected.** Resetting onto upstream target so the fork becomes a normal EdgeEver history."
                ;;
              deploy_mirror_reset)
                echo "**Deploy‑only fork with diverged history.** Resetting onto upstream target."
                ;;
              customized_merge|ahead_with_content_drift)
                echo "**Local application changes detected.** Merging upstream target and leaving production unchanged if verification fails."
                ;;
              *)
                echo "Decision reason: \`${reason}\`."
                ;;
            esac
            if [ "${republish_only}" = "true" ]; then
              echo ""
              echo "\`force_redeploy\` is set: will push an empty commit so Cloudflare Workers Builds runs again."
            fi
            echo ""
            echo "Prefer this workflow over GitHub **Sync fork**. Sync fork tracks upstream \`main\` history and can make the next stable run look like a no‑op even when you expected a merge step to run."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "channel=${UPDATE_CHANNEL} target=${target_ref}@${target_commit:0:12} (v${target_version}) head=${head_commit:0:12} (v${head_version}) reason=${reason} align=${align_mode} update=${update_required} republish=${republish_only}"
